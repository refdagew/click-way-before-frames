name: Build Click-Way-Before-Frames

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows .geode
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build with the Geode SDK
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: Click-Way-Before-Frames-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
